version: 2

project_name: unpause

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && go run ./cmd/unpause completion bash > completions/unpause.bash && go run ./cmd/unpause completion zsh > completions/unpause.zsh && go run ./cmd/unpause completion fish > completions/unpause.fish'

builds:
  - main: ./cmd/unpause
    binary: unpause
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completions/*
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

brews:
  - repository:
      owner: hamzafer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/hamzafer/unpause
    description: "One list of every Claude Code session on your machine. Pick one, it opens where it left off."
    license: MIT
    install: |
      bin.install "unpause"
      bash_completion.install "completions/unpause.bash" => "unpause"
      zsh_completion.install "completions/unpause.zsh" => "_unpause"
      fish_completion.install "completions/unpause.fish"
    test: |
      system "#{bin}/unpause", "--version"

release:
  github:
    owner: hamzafer
    name: unpause
  draft: false
