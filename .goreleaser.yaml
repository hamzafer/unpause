version: 2

project_name: unpause

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/unpause
    binary: unpause
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

brews:
  - repository:
      owner: hamzafer
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/hamzafer/unpause
    description: "One list of every Claude Code session on your machine. Pick one, it opens where it left off."
    license: MIT
    install: |
      bin.install "unpause"
    test: |
      system "#{bin}/unpause", "--version"

release:
  github:
    owner: hamzafer
    name: unpause
  draft: false
